name: campus_app
description: 校园跑腿+仿微信聊天+论坛+个人微博
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.3.3
  socket_io_client: ^2.0.3+1
  shared_preferences: ^2.2.2
  get: ^4.6.6
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  flutter_wechat: ^1.0.0
  permission_handler: ^11.1.0
  flutter_local_notifications: ^16.1.0
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/